name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Shared Module
      run: ./gradlew :shared:build -x test
      
    - name: Build Android App
      run: ./gradlew :app:assembleDebug -x test
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
    - name: Build status
      if: success()
      run: echo "✅ Android build successful!"
      
    - name: Build failed
      if: failure()
      run: echo "❌ Android build failed!"
