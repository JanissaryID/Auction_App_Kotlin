name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Build Release APK
      run: ./gradlew :app:assembleRelease -x test
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30

  release-desktop-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Package Desktop EXE
      run: .\gradlew.bat :desktopApp:packageExe
      
    - name: Package Desktop MSI
      run: .\gradlew.bat :desktopApp:packageMsi
      continue-on-error: true
      
    - name: Upload Desktop Installers
      uses: actions/upload-artifact@v4
      with:
        name: desktop-windows-installers
        path: |
          desktopApp/build/compose/binaries/main/exe/**/*
          desktopApp/build/compose/binaries/main/msi/**/*
        retention-days: 30

  create-release:
    needs: [release-android, release-desktop-windows]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app-release/app-release.apk
          desktop-windows-installers/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
