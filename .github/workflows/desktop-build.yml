name: Desktop Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Build Shared Module
      run: .\gradlew.bat :shared:build -x test
      
    - name: Build Desktop App
      run: .\gradlew.bat :desktopApp:build -x test
      
    - name: Package Desktop App (EXE)
      run: .\gradlew.bat :desktopApp:packageExe
      continue-on-error: true
      
    - name: Upload Desktop Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: desktop-windows
        path: desktopApp/build/compose/binaries/main/**/*
        retention-days: 7
        
    - name: Build status
      if: success()
      run: echo "✅ Desktop Windows build successful!"
      
    - name: Build failed
      if: failure()
      run: echo "❌ Desktop Windows build failed!"

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Build Shared Module
      run: ./gradlew :shared:build -x test
      
    - name: Build Desktop App
      run: ./gradlew :desktopApp:build -x test
      
    - name: Build status
      if: success()
      run: echo "✅ Desktop Linux build successful!"
      
    - name: Build failed
      if: failure()
      run: echo "❌ Desktop Linux build failed!"

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
        
    - name: Build Shared Module
      run: ./gradlew :shared:build -x test
      
    - name: Build Desktop App
      run: ./gradlew :desktopApp:build -x test
      
    - name: Build status
      if: success()
      run: echo "✅ Desktop macOS build successful!"
      
    - name: Build failed
      if: failure()
      run: echo "❌ Desktop macOS build failed!"
